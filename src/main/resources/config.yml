# ===========================================
# XSprint - Minecart Speed Limit Plugin
# ===========================================

# === 语言设置 ===
language: zh_cn

# === 速度显示设置 ===
speed-display:
  enabled: true
  # 显示方法: actionbar(动作栏), title(标题), bossbar(首领栏), scoreboard(计分板)
  method: actionbar

# === 矿车速度配置 ===
# speed: 目标速度上限（整数，格/秒），实际生效时会按类型取上限
# enabled: false 表示不改速度（使用原版）
# 上限：普通矿车 100格/s，熔炉/TNT 矿车 300格/s
minecarts:
  minecart:
    enabled: true
    speed: 60
  chest_minecart:
    enabled: true
    speed: 60
  hopper_minecart:
    enabled: true
    speed: 60
  furnace_minecart:
    enabled: true
    speed: 150
  TNT_minecart:
    enabled: true
    speed: 200
  spawner_minecart:
    enabled: true
    speed: 60
