version: 26.10.25.1
name: XSprint
main: com.xmangge.XSprint.XSprint
api-version: '1.20'
description: Modify minecart speed limits on Paper/Purpur servers
author: XiMangGe
softdepend: []
website: https://github.com/XiMangGe/XSprint

commands:
  XSprint:
    description: Main command for XSprint plugin
    usage: "/XSprint <subcommand>"
    aliases: [xv, xvel]
    permission: XSprint.admin
    permission-message: "§c你没有权限使用此命令。"

permissions:
  XSprint.admin:
    description: Allows using all XSprint commands
    default: op
  XSprint.use:
    description: Allows using XSprint display features
    default: true
